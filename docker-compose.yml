version: '3.8'

services:
  # Application Server - FastAPI backend for movie bookings
  app-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: movie-app-server
    ports:
      - "9000:9000"
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=9000
      - MONGODB_URL=mongodb://mongodb:27017/
    networks:
      - movie-booking-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      - mongodb

  # MongoDB - Database
  mongodb:
    image: mongo:7.0
    container_name: movie-booking-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - movie-booking-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # MongoDB for Raft Node 1 persistence
  mongodb-raft1:
    image: mongo:7.0
    container_name: mongodb-raft-node1
    ports:
      - "27018:27017"
    volumes:
      - mongodb-raft1-data:/data/db
    networks:
      - movie-booking-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # MongoDB for Raft Node 2 persistence
  mongodb-raft2:
    image: mongo:7.0
    container_name: mongodb-raft-node2
    ports:
      - "27019:27017"
    volumes:
      - mongodb-raft2-data:/data/db
    networks:
      - movie-booking-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # MongoDB for Raft Node 3 persistence
  mongodb-raft3:
    image: mongo:7.0
    container_name: mongodb-raft-node3
    ports:
      - "27020:27017"
    volumes:
      - mongodb-raft3-data:/data/db
    networks:
      - movie-booking-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  # Raft Node 1 - Consensus layer
  raft-node1:
    build:
      context: .
      dockerfile: docker/Dockerfile.raft
    container_name: mtbs-raft-node1
    command: ["node1"]
    ports:
      - "50061:50051"   # gRPC port
      - "51061:51051"   # HTTP status port
    environment:
      - DOCKER_ENV=true
      - PYTHONUNBUFFERED=1
      - RAFT_MONGODB_URL=mongodb://mongodb-raft1:27017/
    networks:
      - movie-booking-network
    restart: unless-stopped
    depends_on:
      mongodb-raft1:
        condition: service_healthy

  # Raft Node 2 - Consensus layer
  raft-node2:
    build:
      context: .
      dockerfile: docker/Dockerfile.raft
    container_name: mtbs-raft-node2
    command: ["node2"]
    ports:
      - "50062:50052"   # gRPC port
      - "51062:51052"   # HTTP status port
    environment:
      - DOCKER_ENV=true
      - PYTHONUNBUFFERED=1
      - RAFT_MONGODB_URL=mongodb://mongodb-raft2:27017/
    networks:
      - movie-booking-network
    restart: unless-stopped
    depends_on:
      mongodb-raft2:
        condition: service_healthy

  # Raft Node 3 - Consensus layer
  raft-node3:
    build:
      context: .
      dockerfile: docker/Dockerfile.raft
    container_name: mtbs-raft-node3
    command: ["node3"]
    ports:
      - "50063:50053"   # gRPC port
      - "51063:51053"   # HTTP status port
    environment:
      - DOCKER_ENV=true
      - PYTHONUNBUFFERED=1
      - RAFT_MONGODB_URL=mongodb://mongodb-raft3:27017/
    networks:
      - movie-booking-network
    restart: unless-stopped
    depends_on:
      mongodb-raft3:
        condition: service_healthy

  # LLM Server - FAQ Assistant (optional, can be disabled)
  llm-server:
    build:
      context: .
      dockerfile: docker/Dockerfile.llm
    container_name: movie-llm-server
    ports:
      - "8500:8500"
    environment:
      - LLM_MODEL=distilgpt2
      - LLM_MAX_NEW_TOKENS=128
      - LLM_TEMPERATURE=0.8
      - LLM_TOP_P=0.95
    networks:
      - movie-booking-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    # Uncomment below to limit memory usage for LLM
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 1G

networks:
  movie-booking-network:
    driver: bridge
    name: movie-booking-net

volumes:
  mongodb-data:
    driver: local
  mongodb-raft1-data:
    driver: local
  mongodb-raft2-data:
    driver: local
  mongodb-raft3-data:
    driver: local

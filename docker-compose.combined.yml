services:
  # Combined Frontend + Backend Service
  movie-booking-app:
    build:
      context: .
      dockerfile: Dockerfile.combined
    container_name: movie-booking-combined
    ports:
      - "9000:9000"  # Backend API
      - "3000:3000"  # Frontend Web Server
    environment:
      - APP_HOST=0.0.0.0
      - APP_PORT=9000
      - LLM_SERVER_URL=http://llm-server:8500
      - RAFT_NODE1_URL=http://raft-node1:50051
      - RAFT_NODE2_URL=http://raft-node2:50052
      - RAFT_NODE3_URL=http://raft-node3:50053
    networks:
      - movie-booking-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    depends_on:
      - raft-node1
      - raft-node2
      - raft-node3

  # Raft Node 1 - Consensus layer
  raft-node1:
    build:
      context: .
      dockerfile: Dockerfile.raft
    container_name: raft-node1
    command: ["node1"]
    ports:
      - "50051:50051"
    environment:
      - DOCKER_ENV=true
    networks:
      - movie-booking-network
    restart: unless-stopped

  # Raft Node 2 - Consensus layer
  raft-node2:
    build:
      context: .
      dockerfile: Dockerfile.raft
    container_name: raft-node2
    command: ["node2"]
    ports:
      - "50052:50052"
    environment:
      - DOCKER_ENV=true
    networks:
      - movie-booking-network
    restart: unless-stopped

  # Raft Node 3 - Consensus layer
  raft-node3:
    build:
      context: .
      dockerfile: Dockerfile.raft
    container_name: raft-node3
    command: ["node3"]
    ports:
      - "50053:50053"
    environment:
      - DOCKER_ENV=true
    networks:
      - movie-booking-network
    restart: unless-stopped

  # LLM Server - FAQ Assistant (optional)
  llm-server:
    build:
      context: .
      dockerfile: Dockerfile.llm
    container_name: movie-llm-server
    ports:
      - "8500:8500"
    environment:
      - LLM_MODEL=Qwen/Qwen2.5-0.5B
      - LLM_MAX_NEW_TOKENS=512
      - LLM_TEMPERATURE=0.7
    networks:
      - movie-booking-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

networks:
  movie-booking-network:
    driver: bridge
    name: movie-booking-net

